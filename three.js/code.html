<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_74 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_74" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_74');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('target-hit-container') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xccff00, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xccff00, 2);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Target Ring Geometry
const ringGeom = new THREE.TorusGeometry(2, 0.05, 16, 100);
const ringMat = new THREE.MeshPhongMaterial({ 
    color: 0xccff00, 
    emissive: 0xccff00, 
    emissiveIntensity: 0.5,
    transparent: true,
    opacity: 0.8
});
const ring = new THREE.Mesh(ringGeom, ringMat);
scene.add(ring);

// Crosshair lines
const lineMat = new THREE.MeshBasicMaterial({ color: 0xccff00 });
const verticalLine = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.05), lineMat);
const horizontalLine = new THREE.Mesh(new THREE.BoxGeometry(1, 0.05, 0.05), lineMat);
scene.add(verticalLine);
scene.add(horizontalLine);

// Success Particles
const particleCount = 100;
const particlesGeom = new THREE.BufferGeometry();
const posArray = new Float32Array(particleCount * 3);
for(let i=0; i < particleCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 5;
}
particlesGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
const particlesMat = new THREE.PointsMaterial({ size: 0.05, color: 0xccff00 });
const particleSystem = new THREE.Points(particlesGeom, particlesMat);
scene.add(particleSystem);

camera.position.z = 5;

let time = 0;
function animate() {
    requestAnimationFrame(animate);
    time += 0.05;

    ring.rotation.z += 0.01;
    ring.scale.setScalar(1 + Math.sin(time) * 0.1);
    
    particleSystem.rotation.y += 0.005;
    const positions = particleSystem.geometry.attributes.position.array;
    for(let i=0; i < particleCount * 3; i+=3) {
        positions[i+1] -= 0.01;
        if(positions[i+1] < -2.5) positions[i+1] = 2.5;
    }
    particleSystem.geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_74 -->
</body>
</html>
