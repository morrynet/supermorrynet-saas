<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Precision Sniper - Obsidian Aegis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#c4c9ac",
                    "on-secondary-fixed-variant": "#930005",
                    "surface-dim": "#111415",
                    "outline-variant": "#444933",
                    "on-secondary-container": "#ffd2cc",
                    "on-tertiary-container": "#776300",
                    "on-tertiary": "#3a3000",
                    "error": "#ffb4ab",
                    "on-primary-container": "#556d00",
                    "surface-container": "#1d2021",
                    "tertiary": "#ffffff",
                    "surface-container-high": "#282a2b",
                    "tertiary-fixed-dim": "#e9c400",
                    "on-secondary": "#690003",
                    "surface-container-lowest": "#0c0f10",
                    "secondary": "#ffb4aa",
                    "background": "#111415",
                    "primary": "#ffffff",
                    "primary-container": "#c3f400",
                    "inverse-surface": "#e1e3e4",
                    "on-primary": "#283500",
                    "on-background": "#e1e3e4",
                    "inverse-on-surface": "#2e3132",
                    "surface-tint": "#abd600",
                    "on-surface": "#e1e3e4",
                    "error-container": "#93000a",
                    "on-error": "#690005",
                    "on-tertiary-fixed-variant": "#544600",
                    "secondary-fixed-dim": "#ffb4aa",
                    "secondary-fixed": "#ffdad5",
                    "on-error-container": "#ffdad6",
                    "tertiary-fixed": "#ffe16d",
                    "on-secondary-fixed": "#410001",
                    "surface-bright": "#373a3b",
                    "primary-fixed-dim": "#abd600",
                    "on-primary-fixed-variant": "#3c4d00",
                    "outline": "#8e9379",
                    "surface": "#111415",
                    "surface-container-low": "#191c1d",
                    "surface-container-highest": "#323536",
                    "secondary-container": "#c5020b",
                    "on-tertiary-fixed": "#221b00",
                    "surface-variant": "#323536",
                    "inverse-primary": "#506600",
                    "tertiary-container": "#ffe16d",
                    "on-primary-fixed": "#161e00",
                    "primary-fixed": "#c3f400"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "unit": "4px",
                    "margin-desktop": "32px",
                    "container-max-width": "1440px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "label-caps": ["Inter"],
                    "data-sm": ["JetBrains Mono"],
                    "data-lg": ["JetBrains Mono"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "data-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "data-lg": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]

          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .scan-animation {
            position: relative;
            overflow: hidden;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #c3f400;
            box-shadow: 0 0 15px #c3f400;
            animation: scan 3s ease-in-out infinite;
        }

        @keyframes scan {
            0%, 100% { top: 0%; opacity: 0; }
            10%, 90% { opacity: 1; }
            50% { top: 100%; }
        }

        .glass-panel {
            background: rgba(26, 29, 38, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(45, 49, 57, 1);
            box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.1);
        }

        .neon-glow {
            box-shadow: 0 0 20px rgba(195, 244, 0, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-x-hidden">
<!-- Top AppBar (from JSON) -->
<header class="fixed top-0 w-full bg-background/80 backdrop-blur-xl border-b border-outline-variant/30 flex justify-between items-center px-margin-mobile h-16 z-50">
<div class="flex items-center gap-3 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-primary-fixed" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-headline-md text-headline-md font-bold tracking-tighter text-primary-fixed">PRECISION SNIPER</span>
</div>
<button class="material-symbols-outlined text-on-surface-variant hover:bg-white/5 p-2 rounded-full transition-all">help</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col pt-20 px-margin-mobile pb-8 max-w-lg mx-auto w-full">
<!-- Progress Indicator -->
<div class="flex flex-col gap-2 mb-8">
<div class="flex justify-between items-end">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Hardening Sequence</span>
<span class="font-data-sm text-data-sm text-primary-fixed">STEP 02 <span class="text-outline">/ 04</span></span>
</div>
<div class="h-1 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary-fixed w-1/2 shadow-[0_0_8px_#c3f400]"></div>
</div>
</div>
<!-- Headline & Instructions -->
<div class="mb-10 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Obsidian Aegis Hardening</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enable biometric authentication and bind your Hardware ID (HWID) to this device.</p>
</div>
<!-- Central Biometric Visualization -->
<div class="flex-grow flex items-center justify-center mb-10">
<div class="relative w-48 h-48 flex items-center justify-center">
<!-- Circular Orbitals -->
<div class="absolute inset-0 border border-outline-variant/20 rounded-full animate-[spin_10s_linear_infinite]"></div>
<div class="absolute inset-4 border border-primary-fixed/20 rounded-full animate-[spin_6s_linear_infinite_reverse]"></div>
<!-- Shield & Fingerprint Container -->
<div class="glass-panel w-32 h-32 rounded-full flex items-center justify-center relative overflow-hidden group">
<div class="scan-animation flex items-center justify-center w-full h-full">
<span class="material-symbols-outlined text-primary-fixed text-5xl transition-transform duration-500 group-hover:scale-110" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<div class="scan-line"></div>
</div>
</div>
</div>
</div>
<!-- Controls Section -->
<div class="flex flex-col gap-4 mb-8">
<!-- Biometric Toggle -->
<div class="glass-panel p-4 rounded-xl flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed">face</span>
</div>
<div>
<div class="font-headline-md text-sm font-bold text-primary">FaceID / Fingerprint</div>
<div class="font-data-sm text-data-sm text-on-surface-variant">System-level biometric lock</div>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-fixed"></div>
</label>
</div>
<!-- HWID Registration -->
<button class="glass-panel p-4 rounded-xl flex items-center justify-between hover:bg-white/5 transition-all group">
<div class="flex items-center gap-4 text-left">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed">router</span>
</div>
<div>
<div class="font-headline-md text-sm font-bold text-primary">Register HWID</div>
<div class="font-data-sm text-data-sm text-on-surface-variant">Bind cryptographic hardware key</div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
<!-- Footer Audit & Action -->
<div class="mt-auto flex flex-col gap-6">
<div class="flex items-center justify-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></span>
<span class="font-data-sm text-data-sm text-on-surface-variant uppercase tracking-widest">256-bit AES Handshake Active</span>
</div>
<button class="w-full bg-primary-fixed text-on-primary-fixed py-4 rounded-lg font-headline-md text-sm font-bold uppercase tracking-widest neon-glow hover:scale-[1.02] active:scale-95 transition-all">
                ENFORCE SECURITY
            </button>
</div>
</main>
<!-- Contextual script for micro-interactions -->
<script>
        document.querySelectorAll('button, .glass-panel').forEach(el => {
            el.addEventListener('mousedown', () => {
                el.classList.add('opacity-80');
            });
            el.addEventListener('mouseup', () => {
                el.classList.remove('opacity-80');
            });
        });

        // Simple mock for HWID registration success visual
        const hwidBtn = document.querySelector('button.group');
        hwidBtn.addEventListener('click', () => {
            const icon = hwidBtn.querySelector('.material-symbols-outlined:first-child');
            icon.innerText = 'check_circle';
            icon.classList.remove('text-primary-fixed');
            icon.classList.add('text-primary-fixed');
            hwidBtn.querySelector('.text-on-surface-variant').innerText = 'Hardware Verified: 0x8F...E2';
        });
    </script>
</body></html>
