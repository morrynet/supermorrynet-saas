<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-container {
            background: rgba(26, 29, 38, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(45, 49, 57, 1);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(171, 214, 0, 0.3);
        }
        .success-pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        @keyframes draw-check {
            to { stroke-dashoffset: 0; }
        }
        .animate-draw {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw-check 1s ease-out forwards;
            animation-delay: 0.5s;
        }
    </style>

<path class="animate-draw" d="M8 12L11 15L16 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Headlines -->
<div class="space-y-4 mb-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface tracking-tight">System Deployment Successful</h1>

<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></div>

</div>
</div>

</div>
</div>

<button class="bg-primary-fixed text-on-primary-fixed font-bold py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-fixed-dim transition-all active:scale-95 neon-glow group">
<span class="text-label-caps font-label-caps uppercase tracking-widest">Launch Terminal</span>
<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform" data-icon="terminal">terminal</span>
</button>
<a class="text-on-surface-variant hover:text-primary-fixed transition-colors text-body-md flex items-center justify-center gap-2 group" href="#">
                    View Onboarding Guide

</a>
</div>
</div>
</main>
<!-- Background Decorative Element -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] opacity-10">

</div>
<div class="absolute bottom-0 left-0 w-full h-64 bg-gradient-to-t from-background to-transparent"></div>
</div>
<!-- Micro-interaction Script -->
<script>
        // Subtle parallax effect on the success container
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const container = document.querySelector('.glass-container');
            if(container) {
                container.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Initialize any data states if needed
        console.log('Institutional Deployment Initialized - Secure Node Active');
    </script>
